name: ROS 2 CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
      - name: Build
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install
      - name: Test launch file
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          # Проверка, что launch-файл существует и пакет найден
          ros2 pkg prefix turtle_bringup
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
