name: ROS checks

on: [push, pull_request]

env:
  COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w01-57866a9c98fa.tar.gz
  COURSE_KIT_SHA256: 57866a9c98fa3abdec27b35a180697ee680bfb0f05cc015970ce306d6d849fea

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:lyrical-desktop-full@sha256:e6b1cb530b65588279681db53784e264ce5cf83f2cc33e689d27d6024d7f3ebe
    steps:
      - name: Prepare Node for checkout (GitVerse, Lyrical)
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs
          node --version

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate environment JSON
        shell: bash
        run: python3 -m json.tool evidence/pr01/environment.json > /dev/null

      - name: Download course kit
        shell: bash
        run: |
          curl -fsSLo course-kit.tar.gz "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit

      - name: Check PR evidence
        shell: bash
        run: python3 .course-kit/v1/tools/check_practice.py PR01 --submission .
